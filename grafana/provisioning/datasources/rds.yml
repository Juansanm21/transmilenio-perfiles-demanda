apiVersion: 1
datasources:
  - name: RDS TransMilenio
    uid: rds-transmilenio
    type: grafana-postgresql-datasource
    access: proxy
    url: $DB_HOST:$DB_PORT
    user: $DB_READONLY_USER
    isDefault: true
    jsonData:
      database: $DB_NAME
      sslmode: $DB_SSLMODE
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: $DB_READONLY_PASSWORD
